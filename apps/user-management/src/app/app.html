<section class="remote-page">

    <h1>User Management</h1>
    <p>Manage banking platform users.</p>

    <div class="content-card">

        <h3>User Directory</h3>

        <table>
            <thead>
                <tr>
                    <th>User ID</th>
                    <th>Name</th>
                    <th>Role</th>
                    <th>Status</th>
                </tr>
            </thead>

            <tbody>
                <tr>
                    <td>USR001</td>
                    <td>Rahul</td>
                    <td>Admin</td>
                    <td>Active</td>
                </tr>

                <tr>
                    <td>USR002</td>
                    <td>Priya</td>
                    <td>Provider</td>
                    <td>Active</td>
                </tr>

                <tr>
                    <td>USR003</td>
                    <td>Arun</td>
                    <td>Consumer</td>
                    <td>Inactive</td>
                </tr>
            </tbody>
        </table>

    </div>

    <shared-ui label="Add User" variant="primary" (clicked)="onAddUser()"></shared-ui>

    <div class="form-fields">

        <shared-input id="user-search" label="Search User" placeholder="Enter user name" [value]="searchValue"
            (valueChange)="onSearch($event)"></shared-input>

        <shared-dropdown id="user-role" label="Select Role" placeholder="Choose a role" [options]="roles"
            [value]="selectedRole" [required]="true" (valueChange)="onRoleChange($event)"></shared-dropdown>

    </div>

</section>
