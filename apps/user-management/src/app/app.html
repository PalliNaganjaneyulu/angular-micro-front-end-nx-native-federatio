<section class="remote-page">

    <h1>User Management</h1>
    <p>Manage banking platform users.</p>

    <shared-ui label="Add User" variant="primary" (clicked)="openAddUserModal()">
    </shared-ui>
    <shared-loader [show]="isLoading" message="Loading user information..." size="large">
    </shared-loader>

    <!-- <shared-loader [show]="isLoading" message="Please wait, processing your request..." size="large" [overlay]="true">
    </shared-loader> -->
    <div class="content-card">
        <h3>User Directory</h3>

        <shared-table [columns]="userColumns" [rows]="users" emptyMessage="No users available">
        </shared-table>
    </div>

    <shared-ui label="Delete User" variant="danger" (clicked)="openDeleteConfirmation()">
    </shared-ui>

    <shared-confirmation-dialog [open]="isConfirmationOpen" title="Delete User?"
        message="Are you sure you want to delete this user? This action cannot be undone." confirmText="Yes, Delete"
        cancelText="Cancel" type="danger" (confirmed)="deleteUser()" (cancelled)="closeDeleteConfirmation()">
    </shared-confirmation-dialog>

    <div class="form-fields">

        <shared-input id="user-search" label="Search User" placeholder="Enter user name" [value]="searchValue"
            (valueChange)="onSearch($event)">
        </shared-input>

        <shared-dropdown id="user-role" label="Select Role" placeholder="Choose a role" [options]="roles"
            [value]="selectedRole" [required]="true" (valueChange)="onRoleChange($event)">
        </shared-dropdown>

    </div>

    <shared-modal [open]="isModalOpen" title="Add New User" size="medium" (closed)="closeModal()">

        <div class="modal-form">

            <shared-input id="new-user-name" label="User Name" placeholder="Enter user name" [required]="true">
            </shared-input>

            <shared-dropdown id="new-user-role" label="User Role" placeholder="Select user role" [options]="roles"
                [required]="true">
            </shared-dropdown>

            <div class="modal-actions">

                <shared-ui label="Cancel" variant="secondary" (clicked)="closeModal()">
                </shared-ui>

                <shared-ui label="Save User" variant="primary" (clicked)="saveUser()">
                </shared-ui>

            </div>

        </div>

    </shared-modal>

    <shared-ui label="Test Success Toast" variant="success" (clicked)="showSuccessToast()">
    </shared-ui>

    <shared-toast [show]="isToastVisible" [message]="toastMessage" [type]="toastType" [duration]="3000"
        position="top-right" (dismissed)="closeToast()">
    </shared-toast>

    <shared-ui label="Test Error Toast" variant="danger" (clicked)="showErrorToast()">
    </shared-ui>

    <shared-toast [show]="isToastVisible" [message]="toastMessage" [type]="toastType" [duration]="5000"
        position="top-right" (dismissed)="closeToast()">
    </shared-toast>

</section>
