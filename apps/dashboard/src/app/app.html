<section class="remote-page">
    <h1 class="text-3xl font-bold text-blue-900">Dashboard</h1>
    <p class="mt-3 text-slate-600">Welcome to the NFINITE Banking Platform.</p>

    <button class="mt-6 rounded-lg bg-blue-700 px-6 py-3 font-semibold text-white hover:bg-blue-800">
        Test Tailwind Button
    </button>
    <div class="dashboard-grid">
        <article class="dashboard-card">
            <h3>Total Transactions</h3>
            <h2>12,450</h2>
            <p>Transactions processed</p>
        </article>

        <article class="dashboard-card">
            <h3>Active Users</h3>
            <h2>8,250</h2>
            <p>Registered banking users</p>
        </article>

        <article class="dashboard-card">
            <h3>API Requests</h3>
            <h2>45,680</h2>
            <p>Requests processed</p>
        </article>
    </div>

    <shared-ui label="Save" variant="primary" (clicked)="onSave()"></shared-ui>
    <shared-ui label="Delete User" variant="danger" (clicked)="deleteUser()">
    </shared-ui>
    <shared-ui label="Approve" variant="success" (clicked)="approveUser()">
    </shared-ui>
    <shared-ui label="Submit" variant="primary" [disabled]="true">
    </shared-ui>


</section>
