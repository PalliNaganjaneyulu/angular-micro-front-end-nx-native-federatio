@if (open()) {
<div class="confirmation-backdrop">
    <section class="confirmation-container" role="alertdialog" aria-modal="true" aria-labelledby="confirmation-title"
        aria-describedby="confirmation-message">

        <div class="confirmation-icon" [class]="type()">
            @if (type() === 'danger') {
            !
            } @else if (type() === 'warning') {
            ?
            } @else {
            i
            }
        </div>

        <h2 id="confirmation-title">
            {{ title() }}
        </h2>

        <p id="confirmation-message">
            {{ message() }}
        </p>

        <div class="confirmation-actions">
            <button type="button" class="cancel-button" (click)="onCancel()">
                {{ cancelText() }}
            </button>

            <button type="button" class="confirm-button" [class.danger]="type() === 'danger'"
                [class.warning]="type() === 'warning'" [class.info]="type() === 'info'" (click)="onConfirm()">
                {{ confirmText() }}
            </button>
        </div>

    </section>
</div>
}
