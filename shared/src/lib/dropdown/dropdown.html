<div class="dropdown-container">

    @if (label()) {
    <label [for]="id()">
        {{ label() }}

        @if (required()) {
        <span class="required">*</span>
        }
    </label>
    }

    <select [id]="id()" [value]="value()" [disabled]="disabled()" [required]="required()" (change)="onChange($event)">
        <option value="" disabled>
            {{ placeholder() }}
        </option>

        @for (option of options(); track option.value) {
        <option [value]="option.value">
            {{ option.label }}
        </option>
        }

    </select>

</div>
